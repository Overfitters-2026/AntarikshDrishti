version: '3.8'

services:
  antariksh-drishti:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antariksh_drishti_platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent local vector DB and database state
      - ./Geo_Search/data:/app/Geo_Search/data
      # Persistent satellite imagery & tile cache
      - ./storage:/app/storage
    environment:
      - PYTHONUNBUFFERED=1
      - API_PREFIX=/api/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
